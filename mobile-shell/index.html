<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>FlowForce</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        align-items: center;
        background: #f8fafc;
        color: #111827;
        display: flex;
        min-height: 100dvh;
        margin: 0;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      }

      main {
        margin: 0 auto;
        max-width: 420px;
      }

      h1 {
        font-size: 24px;
        line-height: 1.2;
        margin: 0 0 12px;
      }

      p {
        color: #4b5563;
        font-size: 16px;
        line-height: 1.5;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>FlowForce mobile shell</h1>
      <p>
        Configure CAPACITOR_SERVER_URL and sync the native projects to run the
        live FlowForce app inside this shell.
      </p>
    </main>
  </body>
</html>
